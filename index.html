<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>모아 — AI 스마트 옷장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <section id="auth-screen" class="auth-screen" aria-live="polite"></section>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="모아 홈">
        <span class="brand-mark">m</span>
        <span>moa<span class="brand-dot">.</span></span>
      </a>
      <div class="nav-label">YOUR SPACE</div>
      <nav class="main-nav" aria-label="메인 메뉴">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>오늘의 옷장</button>
        <button class="nav-item" data-view="closet"><span class="nav-icon">▦</span>내 옷장 <span class="nav-count" id="nav-count">0</span></button>
        <button class="nav-item" data-view="saved"><span class="nav-icon">♡</span>저장한 코디</button>
        <button class="nav-item" data-view="insights"><span class="nav-icon">◒</span>옷장 리포트</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="tip-card">
          <span class="tip-icon">✳</span>
          <p>옷을 더 등록하면<br>더 잘 어울리는 코디를<br>찾아드릴게요.</p>
          <button class="text-button" data-action="upload">옷 추가하기 <span>↗</span></button>
        </div>
        <button class="profile-button" data-action="profile">
          <span class="avatar">나</span>
          <span class="profile-copy"><strong id="account-name">나의 스타일</strong><small id="profile-style-label">스타일 설정하기</small></span>
          <span class="profile-more">···</span>
        </button>
        <button class="logout-button" type="button" data-action="logout">로그아웃</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb">나의 공간 <span>/</span> <strong id="breadcrumb-current">오늘의 옷장</strong></div>
        <div class="mobile-account-actions" aria-label="계정 메뉴">
          <button type="button" data-action="profile" aria-label="내 프로필과 사이즈 설정">내 설정</button>
          <button type="button" data-action="logout">로그아웃</button>
        </div>
        <div class="topbar-actions">
          <div class="background-removal-status" id="background-removal-status" role="status" aria-live="polite" hidden></div>
          <div class="cloud-save-indicator" id="cloud-save-status" role="status" aria-live="polite">
            <span data-cloud-save-label>이 기기에 저장됨</span>
            <button type="button" data-action="retry-cloud-save" hidden>다시 저장</button>
          </div>
          <button class="today-date" id="today-date"></button>
        </div>
      </header>
      <div id="view-container"></div>
    </main>
  </div>

  <input id="photo-input" type="file" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>
</body>
</html>
